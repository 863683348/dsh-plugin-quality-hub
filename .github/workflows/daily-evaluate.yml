name: Daily Plugin Evaluation

on:
  schedule:
    # Every day 02:00 UTC (Beijing 10:00) - main evaluation
    - cron: '0 2 * * *'
    # 02:15 UTC - low-quality watchlist generation (after main eval)
    - cron: '15 2 * * *'
    # 19:10 UTC = Beijing 03:10 - daily tutorial generation (3 levels)
    - cron: '10 19 * * *'
    # 19:20 UTC = Beijing 03:20 - daily example generation
    - cron: '20 19 * * *'
    # 19:30 UTC = Beijing 03:30 - daily blog generation
    - cron: '30 19 * * *'
  push:
    # v1.3: 管道代码改动即自动触发一次评估（便于一次大扩库），不再需要手动点 Run workflow
    # v1.4: 内容文件（教程/实例 markdown）变更时自动 seed，发布即上线
    branches: [main]
    paths:
      - '.github/workflows/daily-evaluate.yml'
      - 'app/scripts/daily-evaluate.mts'
      - 'app/scripts/gen-lowquality.mts'
      - 'app/prisma/schema.prisma'
      - 'app/prisma/content/**'
      - 'app/prisma/seed-content.ts'
  workflow_dispatch: # manual trigger — supports bulk scale-up (e.g. TARGET_NEW=700)
    inputs:
      target_new:
        description: 'Target new plugins this run'
        required: false
        default: '100'
        type: string
      max_github:
        description: 'Max real GitHub repos to fetch'
        required: false
        default: '100'
        type: string
      enable_synthetic:
        description: 'Allow synthetic fallback (default false — only real GitHub plugins)'
        required: false
        default: 'false'
        type: boolean
      run_low_quality:
        description: 'Also run low-quality watchlist generation'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: daily-evaluate
  cancel-in-progress: false

jobs:
  # ================= Job 1: 每日评测（真实 GitHub 插件） =================
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run daily evaluation pipeline
        run: npm run evaluate:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # push 触发=管道升级后一次大扩库；cron/manual 用输入参数
          TARGET_NEW: ${{ github.event_name == 'push' && '1000' || inputs.target_new || '100' }}
          MAX_GITHUB: ${{ github.event_name == 'push' && '1000' || inputs.max_github || '100' }}
          ENABLE_SYNTHETIC: ${{ inputs.enable_synthetic || 'false' }}
          REPORT_PATH: evaluate-report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluate-report
          path: app/evaluate-report.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "Daily evaluation failed - check logs above" >> $GITHUB_STEP_SUMMARY

  # ================= Job 4: 教程内容生成（3级各1篇/天） =================
  gen-tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '10 19 * * *' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Generate daily tutorials
        run: npm run gen:tutorials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ================= Job 5: 实例内容生成（每天1篇） =================
  gen-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '20 19 * * *' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Generate daily example
        run: npm run gen:examples
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ================= Job 6: 博客内容生成（每天1篇双语） =================
  gen-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 19 * * *' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Generate daily blog post
        run: npm run gen:blog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Commit and push blog update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app/src/data/blog/posts.ts
          git diff --cached --quiet || git commit -m "chore: add blog post for day ${{ github.run_number }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= Job 2: 低质量插件观察区（合成示例 + 真实 D 级） =================
  low-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 定时(02:15) 或 手动勾选 或 管道脚本变更 时运行
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_low_quality == 'true') || github.event_name == 'push' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Generate low-quality watchlist
        run: npm run gen:lowquality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          TARGET_LOWQ: '60'
          INCLUDE_REAL_D: '1'
          REPORT_PATH: low-quality-report.json

      - name: Upload low-quality report
        uses: actions/upload-artifact@v4
        with:
          name: low-quality-report
          path: app/low-quality-report.json
          retention-days: 14

  # ================= Job 3: 内容 seed（教程/实例 markdown -> Neon） =================
  # 内容文件 push 时自动 seed：写一篇文章提交即上线
  seed-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Seed tutorials & examples content
        run: npm run seed:content
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
