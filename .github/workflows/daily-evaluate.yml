name: Daily Plugin Evaluation

on:
  schedule:
    # Every day 02:00 UTC (Beijing 10:00)
    - cron: '0 2 * * *'
  push:
    # v1.3: 管道代码改动即自动触发一次评估（便于一次大扩库），不再需要手动点 Run workflow
    branches: [main]
    paths:
      - '.github/workflows/daily-evaluate.yml'
      - 'app/scripts/daily-evaluate.mts'
  workflow_dispatch: # manual trigger — supports bulk scale-up (e.g. TARGET_NEW=700)
    inputs:
      target_new:
        description: 'Target new plugins this run'
        required: false
        default: '100'
        type: string
      max_github:
        description: 'Max real GitHub repos to fetch'
        required: false
        default: '100'
        type: string
      enable_synthetic:
        description: 'Allow synthetic fallback (default false — only real GitHub plugins)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: daily-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run daily evaluation pipeline
        run: npm run evaluate:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # push 触发=管道升级后一次大扩库；cron/manual 用输入参数
          TARGET_NEW: ${{ github.event_name == 'push' && '1000' || inputs.target_new || '100' }}
          MAX_GITHUB: ${{ github.event_name == 'push' && '1000' || inputs.max_github || '100' }}
          ENABLE_SYNTHETIC: ${{ inputs.enable_synthetic || 'false' }}
          REPORT_PATH: evaluate-report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluate-report
          path: app/evaluate-report.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "Daily evaluation failed - check logs above" >> $GITHUB_STEP_SUMMARY
